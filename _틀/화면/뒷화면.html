<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>메타사기 4가지 뒷 화면</title>
<link rel="stylesheet" href="../../_공용/글꼴/pretendardvariable-dynamic-subset.css">
<script src="../../_공용/모션.js"></script>
<script src="데이터.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#070a14;font-family:"Pretendard Variable",sans-serif;color:#fff;letter-spacing:-.015em;-webkit-font-smoothing:antialiased;word-break:keep-all}
#무대{position:absolute;inset:0;overflow:hidden}
.배경판{position:absolute;inset:0;background:radial-gradient(120% 90% at 58% 40%,#121a33 0%,#0a0f1f 52%,#05070e 100%)}
.배경낮{position:absolute;inset:0;background:radial-gradient(120% 90% at 58% 40%,#ffffff 0%,#f3f4f7 55%,#e6e8ee 100%)}
.배경빛{will-change:transform,opacity}
.잡음{position:absolute;inset:-60px;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23n)' opacity='.9'/></svg>")}
.테두리그늘{position:absolute;inset:0;background:radial-gradient(130% 100% at 60% 42%,transparent 55%,rgba(0,0,0,.55) 100%)}
.장면{position:absolute;inset:0;will-change:opacity}
.장면>*{position:absolute;left:0;top:0;will-change:transform,opacity}
.번쩍{position:absolute;inset:0;background:#fff;pointer-events:none;mix-blend-mode:screen}

/* 폰 */
.폰{filter:drop-shadow(0 40px 70px rgba(0,0,0,.45))}
.폰틀{width:392px;height:800px;border-radius:64px;padding:4px;background:linear-gradient(145deg,#d6d6db 0%,#8e8e93 28%,#e3e3e7 52%,#7f7f84 78%,#c4c4c8 100%)}
.폰화면{position:relative;width:100%;height:100%;border-radius:60px;overflow:hidden;background:#fff;border:10px solid #050505;color:#111}
.폰화면.어둠{background:#000;color:#fff}
.섬{position:absolute;top:12px;left:50%;width:116px;height:34px;margin-left:-58px;background:#000;border-radius:18px;z-index:9}
.상태{position:absolute;top:0;left:0;right:0;height:52px;display:flex;justify-content:space-between;align-items:center;padding:8px 30px 0 34px;font-weight:600;font-size:16px;z-index:8}
.폰속{position:absolute;inset:0;overflow:hidden}
.홈줄{position:absolute;bottom:8px;left:50%;width:132px;height:5px;margin-left:-66px;border-radius:3px;background:#111;z-index:9}
.폰화면.어둠 .홈줄{background:#fff}

/* 잠금화면 */
.잠금{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%,#2a3f7a 0%,#141c3a 45%,#06080f 100%);color:#fff}
.잠금 .시{position:absolute;top:92px;left:0;right:0;text-align:center;font-size:86px;font-weight:600;letter-spacing:-.03em}
.잠금 .날{position:absolute;top:70px;left:0;right:0;text-align:center;font-size:17px;font-weight:500;opacity:.85}

/* 알림 */
.알림{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:22px;background:rgba(245,245,247,.82);backdrop-filter:blur(18px);color:#111;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.알림 .앱{width:40px;height:40px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center}
.알속{flex:1;min-width:0}.알머리{display:flex;justify-content:space-between;font-size:14.5px}.알머리 span{font-size:12.5px;color:#3c3c43}
.알본문{font-size:14px;line-height:1.35;margin-top:2px;color:#1c1c1e;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* 사진·컷씬 */
.사진카드{overflow:hidden;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06)}
.사진속{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.사진속 img{display:block}
.강조테{position:absolute;border:4px solid #ff3b4f;border-radius:10px}
.형광{position:absolute;background:rgba(255,214,10,.42);mix-blend-mode:multiply;border-radius:3px}
.컷카드{overflow:hidden;border-radius:28px;box-shadow:0 40px 100px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
.컷카드 img{display:block;transform-origin:50% 50%;will-change:transform}
.큰글{display:flex;align-items:center;justify-content:center;letter-spacing:-.05em;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.재현표{position:absolute;right:16px;top:14px;padding:5px 12px;border-radius:999px;background:rgba(0,0,0,.62);color:#fff;font-size:15px;font-weight:600;letter-spacing:0;z-index:20}
.아이콘알{border-radius:34%;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);box-shadow:0 18px 40px rgba(0,0,0,.28)}

/* 장 카드 */
.장수{font-size:400px;font-weight:800;letter-spacing:-.06em;line-height:1;display:flex;align-items:center;justify-content:center;background-clip:text;-webkit-background-clip:text;color:transparent}
.장이름{display:flex;align-items:center;justify-content:center;gap:16px;font-size:54px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.장이름 i{font-style:normal;font-size:28px;font-weight:600;padding:8px 18px;border-radius:999px;border:2px solid currentColor;opacity:.9}
.고리{border-radius:50%;border:3px solid}

/* 카톡 */
.톡{position:absolute;inset:0;background:#b2c7da}
.톡머리{position:absolute;top:52px;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px}
.톡판{position:absolute;left:0;right:0;top:100px;bottom:20px;overflow:hidden}
.톡판 img{position:absolute;left:0;width:100%;will-change:transform}

/* 통화 */
.통화{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 18%,#4b5563,#1c1f26 70%);color:#fff;text-align:center}
.통화 .번{position:absolute;top:150px;left:0;right:0;font-size:38px;font-weight:600;letter-spacing:-.01em}
.통화 .상{position:absolute;top:202px;left:0;right:0;font-size:20px;opacity:.85}
.통화 .끊{position:absolute;bottom:80px;left:50%;margin-left:-40px;width:80px;height:80px;border-radius:50%;background:#ff3b30;display:flex;align-items:center;justify-content:center}
.통화 .격{position:absolute;left:44px;right:44px;bottom:200px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px 0;justify-items:center}.통화 .격 i{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.17)}

/* 폼·창 */
.창{background:#fff;color:#111;border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.45);overflow:hidden}
.창머리{height:58px;display:flex;align-items:center;gap:9px;padding:0 22px;background:#f2f2f5;font-weight:600;font-size:19px}
.창머리 i{width:13px;height:13px;border-radius:50%;background:#ff5f57}.창머리 i+i{background:#febc2e}.창머리 i+i+i{background:#28c840;margin-right:10px}
.칸{margin:0 30px 16px;border:2px solid #d9dce3;border-radius:14px;height:64px;display:flex;align-items:center;padding:0 20px;font-size:24px;gap:16px}
.칸 b{width:150px;font-weight:600;color:#3a3a40;font-size:21px}
.칸 span{flex:1;font-weight:600;letter-spacing:.02em}
.칸.켬{border-color:#3d7dff;box-shadow:0 0 0 5px rgba(61,125,255,.16)}
.단추{margin:6px 30px 30px;height:70px;border-radius:16px;background:#3d7dff;color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* 막대·기타 */
.막대{border-radius:18px 18px 8px 8px;transform-origin:50% 100%}
.막대이름{font-size:30px;font-weight:700;text-align:center;color:#fff;display:flex;align-items:center;justify-content:center}
.블록{border-radius:14px;background:linear-gradient(160deg,#ffd166,#f59e0b);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 10px 24px rgba(0,0,0,.25)}
.점{border-radius:50%}
.타일{border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#ff6b6b,#7c3aed)}
.스위치{border-radius:999px;background:#3a3a44;box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
.스위치 i{position:absolute;top:8px;width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.원판{border-radius:50%;background:radial-gradient(circle at 50% 40%,#1d2747,#0c1226);border:6px solid rgba(255,255,255,.14);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.바늘{border-radius:6px;background:#fff;transform-origin:50% 100%}
.글카드{border-radius:22px;background:#fff;color:#111;box-shadow:0 18px 50px rgba(0,0,0,.35);padding:22px;display:flex;flex-direction:column;gap:12px}
.글카드 .줄{height:16px;border-radius:8px;background:#d9dce3}
.글카드 .머{display:flex;gap:12px;align-items:center}.글카드 .머 i{width:46px;height:46px;border-radius:50%;background:#c7cbd6}.글카드 .머 b{height:18px;width:140px;border-radius:9px;background:#9aa0ae}
.썸{border-radius:16px;overflow:hidden;background:#1f2433;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.진행{border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden}.진행 i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#2fbf71,#7be495)}
.구독{border-radius:999px;background:#ff0033;color:#fff;font-size:44px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:0 20px 50px rgba(255,0,51,.35)}
.도장{border:12px solid #ff2d3d;color:#ff2d3d;border-radius:28px;font-size:170px;font-weight:900;display:flex;align-items:center;justify-content:center;letter-spacing:-.02em;background:rgba(255,45,61,.08)}
</style></head><body>
<div id="무대"></div>

<script src="장면_부품.js"></script>
<script src="장면_가.js"></script>
<script src="장면_나.js"></script>
<script src="장면_다.js"></script>

</body></html>
